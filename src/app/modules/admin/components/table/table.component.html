<table class="table">
    <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Imagen</th>
            <th scope="col">Nombre</th>
            <th scope="col">Precio</th>
            <th scope="col">Descripción</th>
            <th scope="col">Categoría</th>
            <th scope="col">Acciones</th>
            
            
        </tr>
    </thead>

    <tbody>
        <tr *ngFor="let producto of coleccionProductos">
            <th scope="row"></th>

            <td>
                <img src="{{producto.imagen}}" alt="{{producto.alt}}">
            </td>
            <td>{{producto.nombre}}</td>
            <td>{{producto.precio}}</td>
            <td>{{producto.descripcion}}</td>
            <td>{{producto.categoria}}</td>
           
            <!--ACCIONES-->
            <td>
                <button id="btn-edit" title="Editar" type="button" class="btn btn-outline-warning">
                    <mat-icon>edit</mat-icon>
                </button>
            </td>
            <td>
                <button id="btn-delete" title="Eliminar" type="button" class="btn btn-outline-danger"
                data-bs-toggle="modal" data-bs-target="#eliminarProducto" (click)="mostrarBorrar(producto)">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </tr>
    </tbody>
</table>




<!-- BOTON AGREGAR NUEVOS PRODUCTOS -->
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#agregarProducto">
    Agregar un nuevo producto
  </button>
  
  <!-- Modal -->
  <div class="modal fade" id="agregarProducto" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
            <!--titulo del modal-->
          <h1 class="modal-title fs-5" id="exampleModalLabel">Ingrese un nuevo producto</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <!--cuerpo del modal-->
        <div [formGroup]="producto" class="modal-body">
          <div class="mb-3">
            <label class="form-label">Ingrese el nombre del producto</label>
            <input class="form-control" type="text" formControlName="nombre" placeholder="Ej:">
          </div>

          <div class="mb-3">
            <label class="form-label">Ingrese el precio del producto</label>
            <input class="form-control" type="number" formControlName="precio" placeholder="Ej:">
          </div>

          <div class="mb-3">
            <label class="form-label">Ingrese la descripcion del producto</label>
            <input class="form-control" type="text" formControlName="descripcion" placeholder="Ej:">
          </div>

          <div class="mb-3">
            <label class="form-label">Ingrese la categoria del producto</label>
            <select class="form-control" formControlName="categoria" class="form-select">
                <option selected>Elija opcion</option>
                <option value="productos">muebles</option>
                <option value="rareza">alimento</option>
                <option value="tienda">juguete</option>
                <option value="tipo">ropa</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Ingrese la imagen del producto</label>
            <input class="form-control" type="text" formControlName="imagen" placeholder="Ej:">
          </div>

          <div class="mb-3">
            <label class="form-label">Ingrese el alt del producto</label>
            <input class="form-control" type="text" formControlName="alt" placeholder="Ej:">
          </div>

          
          <!--Acciones del modal-->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-success" (click)="agregarProducto()" data-bs-dismiss="modal">Guardar</button>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </div>
    </div>
  </div>


<!--modal para editar-->

      <!--cuerpo del modal-->
      <div [formGroup]="producto" class="modal-body">
        <div class="mb-3">
          <label class="form-label">edite el nombre del producto</label>

        </div>

        <div class="mb-3">

          <input class="form-control" type="number" formControlName="precio" placeholder="{{productoEdit.precio}}">
        </div>

        <div class="mb-3">
          <label class="form-label">Ingrese la descripcion del producto</label>
          <input class="form-control" type="text" formControlName="descripcion" placeholder="{{productoEdit.descripcion}}">
        </div>

        <div class="mb-3">
          <label class="form-label">Ingrese la categoria del producto</label>
          <select class="form-control" formControlName="categoria" class="form-select">
              <option selected>Elija opcion</option>
              <option value="productos">muebles</option>
              <option value="rareza">alimento</option>
              <option value="tienda">juguete</option>
              <option value="tipo">ropa</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Ingrese la imagen del producto</label>
          <input class="form-control" type="text" formControlName="imagen" placeholder="Ej:">
        </div>

        <div class="mb-3">
          <label class="form-label">Ingrese el alt del producto</label>
          <input class="form-control" type="text" formControlName="alt" placeholder="Ej:">
        </div>

        
        <!--Acciones del modal-->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-success" (click)="agregarProducto()" data-bs-dismiss="modal">Guardar</button>
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal para eliminar productos -->
<div class="modal fade" *ngIf="modalVisibleProducto" id="eliminarProducto" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">¿Esta seguro de eliminar el producto?</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        {{productoSeleccionado.nombre}}
        <img src="{{productoSeleccionado.imagen}}" alt="{{productoSeleccionado.alt}}">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal"  (click)="borrarProducto()">Eliminar</button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Cancelar</button>
      </div>
    </div>
  </div>
</div>
