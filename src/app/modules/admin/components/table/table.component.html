<!-- BOTON AGREGAR NUEVOS PRODUCTOS -->
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#agregarProducto">
    Agregar un nuevo producto
  </button>
  
  <!-- Modal -->
  <div class="modal fade" id="agregarProducto" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
            <!--titulo del modal-->
          <h1 class="modal-title fs-5" id="exampleModalLabel">Ingrese un nuevo producto</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <!--cuerpo del modal-->
        <div [formGroup]="producto" class="modal-body">
          <div class="mb-3">
            <label class="form-label">Ingrese el nombre del producto</label>
            <input class="form-control" type="text" formControlName="nombre" placeholder="Ej:"></input>
          </div>

          <div class="mb-3">
            <label class="form-label">Ingrese el precio del producto</label>
            <input class="form-control" type="number" formControlName="precio" placeholder="Ej:"></input>
          </div>

          <div class="mb-3">
            <label class="form-label">Ingrese la descripcion del producto</label>
            <input class="form-control" type="text" formControlName="descripcion" placeholder="Ej:"></input>
          </div>

          <div class="mb-3">
            <label class="form-label">Ingrese la categoria del producto</label>
            <select class="form-control" formControlName="categoria" class="form-select">
                <option selected>Elija opcion</option>
                <option value="productos"></option>
                <option value="rareza"></option>
                <option value="tienda"></option>
                <option value="tipo"></option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Ingrese la imagen del producto</label>
            <input class="form-control" type="text" formControlName="imagen" placeholder="Ej:"></input>
          </div>

          <div class="mb-3">
            <label class="form-label">Ingrese el alt del producto</label>
            <input class="form-control" type="text" formControlName="alt" placeholder="Ej:"></input>
          </div>

          
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary">Save changes</button>
        </div>
      </div>
    </div>
  </div>
